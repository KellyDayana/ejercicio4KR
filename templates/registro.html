{% extends 'plantillaPrincipal.html' %}
{% load static %}

{% block contenido %}

<div class="container-fluid bg-breadcrumb" style="
    background: linear-gradient(rgba(19, 53, 123, 0.7), rgba(19, 53, 123, 0.7)), 
    url('{% static 'img/destination-2.jpg' %}') center center no-repeat; 
    background-size: cover; 
    padding: 120px 0 60px 0;">
    <div class="container text-center py-4">
        <h3 class="text-white display-3 mb-3">Registrarse</h3>
    </div>
</div>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-5">
                    <h4 class="text-center mb-4 text-primary"><i class="fas fa-user-plus me-2"></i>Crea tu cuenta</h4>
                    
                    <form action="{% url 'registro' %}" method="POST">
                        {% csrf_token %}
                        
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" required>
                            <label for="username"><i class="fas fa-user me-2 text-muted"></i>Nombre de usuario</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" name="email" placeholder="Correo electrónico" required>
                            <label for="email"><i class="fas fa-envelope me-2 text-muted"></i>Correo electrónico</label>
                        </div>
                        
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                            <label for="password"><i class="fas fa-lock me-2 text-muted"></i>Contraseña</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="password_confirm" name="password_confirm" placeholder="Confirmar Contraseña" required>
                            <label for="password_confirm"><i class="fas fa-check-double me-2 text-muted"></i>Confirmar contraseña</label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-3">
                            <i class="fas fa-user-plus me-2"></i>Crear Cuenta
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="text-primary fw-bold">Inicia sesión aquí</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
